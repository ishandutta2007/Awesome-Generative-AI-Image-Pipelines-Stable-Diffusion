<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0518"/><stop offset="45%" stop-color="#110d29"/><stop offset="80%" stop-color="#160824"/><stop offset="100%" stop-color="#06020f"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="24"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="40"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="rgba(168, 85, 247, 0.2)"/></pattern></defs><style>@keyframes pulseOrb1{0%{transform:translate(0,0) scale(1);opacity:.35}50%{transform:translate(40px,-20px) scale(1.15);opacity:.55}}@keyframes pulseOrb2{0%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(-30px,30px) scale(1.2);opacity:.5}}@keyframes pulseFlow{0%{stroke-dashoffset:200}}@keyframes nodeBlink{0%{opacity:.4}50%{opacity:.9}}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px;fill:#fff}.pill-text,.subtitle-text,.tagline-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:19px;fill:#cbd5e1}.pill-text,.tagline-text{font-weight:600}.tagline-text{font-size:13px;letter-spacing:1.5px;fill:#c084fc;text-transform:uppercase}.pill-text{font-size:12px;fill:#e2e8f0}.orb-1{animation:pulseOrb1 9s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb2 11s ease-in-out infinite;transform-origin:1050px 300px}.flow-line{stroke-dasharray:8 12;animation:pulseFlow 6s linear infinite}.status-dot{animation:nodeBlink 3s ease-in-out infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g filter="url(#softGlow)"><circle cx="220" cy="90" r="140" fill="#a855f7" class="orb-1"/><circle cx="1020" cy="310" r="160" fill="#3b82f6" class="orb-2"/><circle cx="650" cy="380" r="100" fill="#ec4899" opacity=".25"/></g><g opacity=".45"><path fill="none" stroke="#a855f7" stroke-width="2" d="M 80 80 Q 300 20 520 80 T 960 60" class="flow-line"/><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 120 360 Q 400 390 700 340 T 1120 350" class="flow-line"/><circle cx="520" cy="80" r="4" fill="#c084fc" class="status-dot"/><circle cx="700" cy="340" r="4" fill="#38bdf8" class="status-dot"/></g><g transform="translate(60, 65)"><rect width="270" height="28" fill="#a855f7" fill-opacity=".15" stroke="#c084fc" stroke-opacity=".3" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="4" fill="#a855f7" class="status-dot"/><text x="28" y="18.5" class="tagline-text">Curated Diffusion &amp; AI Stack</text></g><text x="60" y="150" class="title-text">Generative AI Image Pipelines</text><text x="60" y="202" fill="url(#primaryGrad)" class="title-text">&amp; Stable Diffusion Ecosystem</text><text x="60" y="250" class="subtitle-text">Modular Node Graphs (ComfyUI), WebUIs (Forge/A1111), Conditioning (ControlNet/IP-Adapter),</text><text x="60" y="278" fill="#94a3b8" class="subtitle-text">Rectified Flow Transformers (FLUX.1/SD3.5), and Production Inference Engines.</text><g><g transform="translate(60, 325) translate(0, 0)"><rect width="180" height="38" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity=".4" stroke-width="1.2" rx="19"/><text x="90" y="24" class="pill-text" text-anchor="middle">⚡ ComfyUI Nodes</text></g><g transform="translate(60, 325) translate(195, 0)"><rect width="170" height="38" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1.2" rx="19"/><text x="85" y="24" class="pill-text" text-anchor="middle">🎨 FLUX &amp; SD3.5</text></g><g transform="translate(60, 325) translate(380, 0)"><rect width="210" height="38" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity=".4" stroke-width="1.2" rx="19"/><text x="105" y="24" class="pill-text" text-anchor="middle">🧩 ControlNet &amp; IP-Adapter</text></g><g transform="translate(60, 325) translate(605, 0)"><rect width="195" height="38" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity=".4" stroke-width="1.2" rx="19"/><text x="97" y="24" class="pill-text" text-anchor="middle">🚀 WebUI Forge &amp; A1111</text></g><g transform="translate(60, 325) translate(815, 0)"><rect width="190" height="38" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity=".4" stroke-width="1.2" rx="19"/><text x="95" y="24" class="pill-text" text-anchor="middle">🔥 Diffusers &amp; TensorRT</text></g></g><rect width="1199" height="419" x=".5" y=".5" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="15.5"/></svg>