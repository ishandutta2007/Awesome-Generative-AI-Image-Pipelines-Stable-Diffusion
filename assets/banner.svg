<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="45%" stop-color="#110d29" />
      <stop offset="80%" stop-color="#160824" />
      <stop offset="100%" stop-color="#06020f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(168, 85, 247, 0.2)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #cbd5e1;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      fill: #c084fc;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* Animated Ambient Lights */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-30px, 30px) scale(1.2); opacity: 0.5; }
    }
    @keyframes pulseFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    .orb-1 {
      animation: pulseOrb1 9s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb2 11s ease-in-out infinite;
      transform-origin: 1050px 300px;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: pulseFlow 6s linear infinite;
    }
    .status-dot {
      animation: nodeBlink 3s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs -->
  <g filter="url(#softGlow)">
    <circle class="orb-1" cx="220" cy="90" r="140" fill="#a855f7" />
    <circle class="orb-2" cx="1020" cy="310" r="160" fill="#3b82f6" />
    <circle cx="650" cy="380" r="100" fill="#ec4899" opacity="0.25" />
  </g>

  <!-- Ambient Node Graph Flow Lines in Background -->
  <g opacity="0.45">
    <path class="flow-line" d="M 80 80 Q 300 20 520 80 T 960 60" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="flow-line" d="M 120 360 Q 400 390 700 340 T 1120 350" fill="none" stroke="#06b6d4" stroke-width="2" />
    <circle cx="520" cy="80" r="4" fill="#c084fc" class="status-dot" />
    <circle cx="700" cy="340" r="4" fill="#38bdf8" class="status-dot" />
  </g>

  <!-- Foreground Content: Header Tagline -->
  <g transform="translate(60, 65)">
    <rect width="270" height="28" rx="14" fill="#a855f7" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#a855f7" class="status-dot" />
    <text x="28" y="18.5" class="tagline-text">Curated Diffusion &amp; AI Stack</text>
  </g>

  <!-- Foreground Main Title -->
  <text x="60" y="150" class="title-text">
    Generative AI Image Pipelines
  </text>
  <!-- Accent Title Line -->
  <text x="60" y="202" class="title-text" fill="url(#primaryGrad)">
    &amp; Stable Diffusion Ecosystem
  </text>

  <!-- Subtitle Text -->
  <text x="60" y="250" class="subtitle-text">
    Modular Node Graphs (ComfyUI), WebUIs (Forge/A1111), Conditioning (ControlNet/IP-Adapter),
  </text>
  <text x="60" y="278" class="subtitle-text" fill="#94a3b8">
    Rectified Flow Transformers (FLUX.1/SD3.5), and Production Inference Engines.
  </text>

  <!-- Interactive & Feature Pills Container -->
  <g transform="translate(60, 325)">
    <!-- Pill 1: ComfyUI & Node Graphs -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" class="pill-text">⚡ ComfyUI Nodes</text>
    </g>

    <!-- Pill 2: FLUX.1 & SD 3.5 -->
    <g transform="translate(195, 0)">
      <rect width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="85" y="24" text-anchor="middle" class="pill-text">🎨 FLUX &amp; SD3.5</text>
    </g>

    <!-- Pill 3: ControlNet & Adapters -->
    <g transform="translate(380, 0)">
      <rect width="210" height="38" rx="19" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="105" y="24" text-anchor="middle" class="pill-text">🧩 ControlNet &amp; IP-Adapter</text>
    </g>

    <!-- Pill 4: WebUI Forge & A1111 -->
    <g transform="translate(605, 0)">
      <rect width="195" height="38" rx="19" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="97" y="24" text-anchor="middle" class="pill-text">🚀 WebUI Forge &amp; A1111</text>
    </g>

    <!-- Pill 5: C++/Diffusers Inference -->
    <g transform="translate(815, 0)">
      <rect width="190" height="38" rx="19" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="95" y="24" text-anchor="middle" class="pill-text">🔥 Diffusers &amp; TensorRT</text>
    </g>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
</svg>